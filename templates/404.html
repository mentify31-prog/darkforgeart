{% extends "base.html" %}

    <p style="color:var(--color-text-muted);margin-bottom:2rem;">This page doesn't exist or has been moved.</p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
      <a href="{% url 'gallery:home' %}" class="btn btn-primary">Home</a>
