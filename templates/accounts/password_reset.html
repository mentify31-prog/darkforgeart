{% extends "base.html" %}

{% block content %}
<section>
  <div class="container" style="max-width:480px;">
    <h1 style="font-size:1.75rem;margin-bottom:0.75rem;">Reset Password</h1>
    <p style="color:var(--color-text-muted);margin-bottom:2rem;">Enter your email address and we'll send you a reset link.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="form-error">{{ field.errors.0 }}</p>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Send Reset Link</button>
    </form>
    <p style="margin-top:1.5rem;text-align:center;font-size:0.875rem;color:var(--color-text-muted);">
      <a href="{% url 'accounts:login' %}">Back to Sign In</a>
    </p>
  </div>
</section>
{% endblock %}
