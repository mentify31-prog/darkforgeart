{% extends "base.html" %}

{% block content %}
<section>
  <div class="container" style="max-width:480px;">
    <div style="margin-bottom:2.5rem;">
      <p class="text-upper text-muted" style="margin-bottom:0.5rem;">Welcome Back</p>
      <h1 style="font-size:2rem;">Sign In</h1>
      <p style="color:var(--color-text-muted);margin-top:0.75rem;">
        No account? <a href="{% url 'accounts:register' %}">Create one</a>
      </p>
    </div>

    {# Google #}
    <a href="{% url 'accounts:google_login' %}" class="btn btn-outline" style="width:100%;justify-content:center;gap:0.75rem;margin-bottom:2rem;padding:0.85rem;">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>

    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:2rem;">
      <hr style="flex:1;margin:0;">
      <span style="color:var(--color-text-faint);font-size:0.8rem;">or email</span>
      <hr style="flex:1;margin:0;">
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="form-error">{{ field.errors.0 }}</p>{% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
        Sign In
      </button>
    </form>

    <p style="margin-top:1.5rem;text-align:center;font-size:0.875rem;color:var(--color-text-muted);">
      <a href="{% url 'accounts:password_reset' %}">Forgot your password?</a>
    </p>
  </div>
</section>
{% endblock %}
