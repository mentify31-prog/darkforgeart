<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Reset your password - DarkForge Art</title></head>
<body style="background:#0a0a0a;color:#e8e4dc;font-family:'Inter',system-ui,sans-serif;margin:0;padding:40px 20px;">
  <div style="max-width:560px;margin:0 auto;">
    <h1 style="font-family:Georgia,serif;color:#ffffff;margin-bottom:0.5rem;">DarkForge Art</h1>
    <hr style="border:none;border-top:1px solid #222;margin:1.5rem 0;">
    <h2 style="font-family:Georgia,serif;font-size:1.2rem;color:#ffffff;margin-bottom:1rem;">Reset Your Password</h2>
    <p style="color:#888880;line-height:1.7;margin-bottom:1.5rem;">
      Click the button below to set a new password. This link expires in 24 hours.
    </p>
    <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
       style="display:inline-block;background:#b91c1c;color:#ffffff;padding:12px 28px;text-decoration:none;font-size:0.875rem;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:1.5rem;">
      Reset Password
    </a>
    <p style="color:#444;font-size:0.75rem;">If you did not request this, ignore this email. Your password will not change.</p>
    <hr style="border:none;border-top:1px solid #222;margin:1.5rem 0;">
    <p style="color:#444;font-size:0.75rem;">DarkForge Art</p>
  </div>
</body>
</html>
