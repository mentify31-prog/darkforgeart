{% extends "base.html" %}
{% block content %}
<section>
  <div class="container" style="max-width:480px;text-align:center;padding-top:3rem;">
    <h1 style="font-size:1.75rem;margin-bottom:1rem;">Check Your Email</h1>
    <p style="color:var(--color-text-muted);margin-bottom:2rem;">
      If an account exists for that email address, a password reset link has been sent. Check your inbox (and spam folder).
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline">Back to Sign In</a>
  </div>
</section>
{% endblock %}
